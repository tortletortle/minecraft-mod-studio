name: Schema Engine 26.2 Experiment

on:
  push:
    branches:
      - experiment/schema-engine-codecui-26.2
    paths:
      - "experiments/schema-engine-26.2/**"
      - ".github/workflows/schema-engine-experiment.yml"
  pull_request:
    paths:
      - "experiments/schema-engine-26.2/**"
      - ".github/workflows/schema-engine-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Run projection tests and compile the Fabric mod
        working-directory: experiments/schema-engine-26.2
        run: gradle --no-daemon --console=plain test build

      - name: Upload experiment JAR
        uses: actions/upload-artifact@v4
        with:
          name: mms-schema-engine-experiment-26.2
          path: experiments/schema-engine-26.2/build/libs/*.jar
          if-no-files-found: error
