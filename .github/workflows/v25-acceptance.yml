name: V2.5 Engineering Acceptance

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - README.md
      - docs/**
      - Minecraft_Mod_Studio_V19.html
      - tests/**
      - scripts/**
      - requirements-dev.txt
      - .github/workflows/**
  push:
    branches:
      - main
    paths:
      - README.md
      - docs/**
      - Minecraft_Mod_Studio_V19.html
      - tests/**
      - scripts/**
      - requirements-dev.txt
      - .github/workflows/**

permissions:
  contents: read

jobs:
  browser-and-fabric-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Install static test dependency
        run: |
          python -m pip install pyyaml
          python -c "import importlib.util; assert importlib.util.find_spec('playwright') is None; print('Playwright is absent before static checks')"

      - name: Validate workflow safety and PR gates
        run: |
          python tests/acceptance/test_workflow_policy.py
          echo "workflow policy exit code: $?"

      - name: Python syntax and unified static checks
        run: |
          python -m py_compile scripts/test.py tests/resources/archive_security.py tests/resources/resource_library_acceptance.py
          echo "py_compile exit code: $?"
          python scripts/test.py static
          echo "static exit code: $?"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium

      - name: Browser and archive acceptance through unified test entry
        run: |
          python scripts/test.py browser --work-dir "$RUNNER_TEMP/mms-local-tests"
          echo "browser exit code: $?"
          git status --short
          test -z "$(git status --porcelain)"
          echo "git status --porcelain: clean"

      - name: Build generated Fabric project
        run: |
          python "$RUNNER_TEMP/mms-local-tests/export/studio_build.py" build

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-mod-studio-v25-acceptance
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/mms-local-tests/export-source.zip
            ${{ runner.temp }}/mms-local-tests/export/studio-export-report.json
            ${{ runner.temp }}/mms-local-tests/export/studio-build-result.json
            ${{ runner.temp }}/mms-local-tests/export/studio-build.log
            ${{ runner.temp }}/mms-local-tests/export/build/libs/*.jar
            ${{ runner.temp }}/mms-local-tests/archive-security-result.json
