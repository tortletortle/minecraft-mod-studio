name: AI Debug Lab Windows core tests
on:
  push:
    branches: [ai-debug-lab-v0.1, feature/ai-debug-runtime-cache-v0.12.2]
    paths: ['ai-debug-lab/**','.github/workflows/ai-debug-lab-windows.yml']
  pull_request:
    branches: [ai-debug-lab-v0.1, feature/ai-debug-runtime-cache-v0.12.2]
    paths: ['ai-debug-lab/**','.github/workflows/ai-debug-lab-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s ai-debug-lab -p 'test_*.py' -v
