name: Mod Analyzer Research

on:
  push:
    branches:
      - research/horizon-adapter
    paths:
      - "research/java-analyzer/**"
      - ".github/workflows/mod-analyzer-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyzer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/horizon-adapter

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run reproducible analyzer test suite
        run: bash research/java-analyzer/run-tests.sh
