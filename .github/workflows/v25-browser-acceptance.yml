name: V25 browser acceptance

on:
  push:
    branches:
      - research/extension-engine
    paths:
      - Minecraft_Mod_Studio_V25.html
      - research/extension-engine/**
      - .github/workflows/v25-browser-acceptance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run extension unit and integration suites
        run: |
          node research/extension-engine/registry.test.mjs
          node research/extension-engine/host-tools.test.mjs
          node research/extension-engine/package-manager.test.mjs
          node research/extension-engine/archive.test.mjs
          node research/extension-engine/archive-writer.test.mjs
          node research/extension-engine/persistent-store.test.mjs
          node research/extension-engine/publisher-trust.test.mjs
          node research/extension-engine/v25-host-bridge.test.mjs
          node research/extension-engine/v25-extension-runtime.test.mjs
          node research/extension-engine/v25-extension-manager.test.mjs
          node --test research/extension-engine/v09-rollback-retention.test.mjs
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run V0.9 two-tab Chromium acceptance
        run: node research/extension-engine/v09-multitab-acceptance.mjs
      - name: Run V25 browser acceptance
        run: node research/extension-engine/v25-browser-acceptance.mjs
