name: V25 browser acceptance

on:
  push:
    branches:
      - research/extension-engine
    paths:
      - Minecraft_Mod_Studio_V25.html
      - research/extension-engine/**
      - .github/workflows/v25-browser-acceptance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run persistent-store regression suite
        run: node research/extension-engine/persistent-store.test.mjs
      - name: Run V0.9 rollback-retention regression suite
        run: node --test research/extension-engine/v09-rollback-retention.test.mjs
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run V25 browser acceptance
        run: node research/extension-engine/v25-browser-acceptance.mjs
