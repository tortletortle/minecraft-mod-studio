name: CI Runner Smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ci-runner-smoke.yml

permissions: {}

jobs:
  runner-smoke:
    name: Hosted runner allocation smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify runner allocation without checkout or dependencies
        shell: bash
        run: |
          set -eu
          echo "SMOKE_START"
          echo "runner_os=${RUNNER_OS:-unknown}"
          echo "runner_arch=${RUNNER_ARCH:-unknown}"
          echo "runner_name=${RUNNER_NAME:-unknown}"
          uname -a
          python3 --version
          node --version
          echo "SMOKE_PASS"
