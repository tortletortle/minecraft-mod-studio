name: Structure Studio core
on:
  push:
    branches: ['feature/structure-studio-v0.1']
    paths: ['structure-studio/**', '.github/workflows/structure-studio.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Core regression and gzip
        run: node structure-studio/core.test.mjs
      - name: Export CLI smoke test
        run: |
          node structure-studio/export.mjs house 42 /tmp/structure-studio/house.nbt
          node structure-studio/export.mjs tower 42 /tmp/structure-studio/tower.nbt
          node structure-studio/export.mjs factory 42 /tmp/structure-studio/factory.nbt
          gzip -t /tmp/structure-studio/*.nbt
          if node structure-studio/export.mjs house 42 /tmp/structure-studio/house.nbt; then exit 1; fi
          if node structure-studio/export.mjs house -1 /tmp/structure-studio/invalid.nbt; then exit 1; fi
          test ! -e /tmp/structure-studio/invalid.nbt
      - name: Data pack graph and landing regression
        run: node structure-studio/pack.test.mjs
      - name: Data pack output smoke test
        run: |
          node structure-studio/export-pack.mjs structure-studio/example-pack.json /tmp/mms-test-pack
          test -f /tmp/mms-test-pack/pack.mcmeta
          gzip -t /tmp/mms-test-pack/data/mms_structure/structure/*.nbt
          test -f /tmp/mms-test-pack/data/mms_structure/worldgen/structure/factory.json
          test ! -e /tmp/mms-test-pack/data/mms_structure/worldgen/structure/house.json
          if node structure-studio/export-pack.mjs structure-studio/example-pack.json /tmp/mms-test-pack; then exit 1; fi
      - name: Editor data model and projection
        run: node structure-studio/editor.test.mjs
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser editor acceptance
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/mms-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for attempt in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:8765/structure-studio/editor.html >/dev/null; then break; fi
            sleep 1
          done
          python structure-studio/test_browser.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: structure-editor-acceptance
          path: structure-editor-acceptance.png
