name: AI Debug Lab real MCP playtest
on:
  workflow_dispatch:
    inputs:
      accept_eula:
        description: Confirm Minecraft EULA for the isolated Fabric server
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  live_mcp:
    if: github.event_name == 'workflow_dispatch' && inputs.accept_eula == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - run: python -m pip install -r ai-debug-lab/requirements-mcp.txt
      - run: gradle -p ai-debug-lab/probe --no-daemon --console=plain build
      - run: python ai-debug-lab/playtest.py prepare --assets "$RUNNER_TEMP/playtest-assets" --probe ai-debug-lab/probe/build/libs/mms-debug-probe-0.3.0.jar
      - run: python ai-debug-lab/playtest_check.py --assets "$RUNNER_TEMP/playtest-assets" --evidence "$RUNNER_TEMP/playtest-results" --accept-eula
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-mcp-playtest
          path: |
            ${{ runner.temp }}/playtest-results/
            ai-debug-lab/probe/build/libs/*.jar
