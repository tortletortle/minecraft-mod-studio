name: V2.6 Resource Library Acceptance

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - Minecraft_Mod_Studio_V19.html
      - tests/resources/**
      - .github/workflows/v26-resource-library.yml
  push:
    branches:
      - main
      - v2.5-engineering-acceptance
    paths:
      - Minecraft_Mod_Studio_V19.html
      - tests/resources/**
      - .github/workflows/v26-resource-library.yml

permissions:
  contents: read

concurrency:
  group: mms-resource-library-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resource-library:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright Pillow
          python -m playwright install chromium
      - name: Test import, persistence, migration, compatibility and real Fabric JAR build
        run: python tests/resources/resource_library_acceptance.py
      - name: Test ZIP/JAR parser security boundaries
        run: python tests/resources/archive_security.py
      - name: Upload acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mms-v26-resource-library-acceptance
          if-no-files-found: warn
          path: |
            resource-library-acceptance-result.json
            archive-security-result.json
