plugins { id 'net.fabricmc.fabric-loom' version '1.17.12' }
group = 'studio.conflictfixture'
version = '0.7.0'
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.20.1'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.2'
}
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
def fixtures = [fixture_lib:'Positions', fixture_alpha:'Alpha', fixture_beta:'Beta', fixture_noise:null]
def fixtureTasks = fixtures.collect { id, cls ->
    tasks.register("jar_${id}", Jar) {
        dependsOn classes
        archiveFileName = "${id}.jar"
        destinationDirectory = layout.buildDirectory.dir("fixtures")
        if (cls != null) {
            from(sourceSets.main.output.classesDirs) { include "studio/conflictfixture/${cls}.class" }
        }
        from("manifests/${id}")
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}
tasks.register('fixtures') { dependsOn fixtureTasks }
