<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Structure Studio V0.4</title>
<style>
:root{color-scheme:dark;--bg:#16191d;--panel:#202429;--border:#3b4147;--muted:#a2abb3;--green:#51d88b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#e8edf1;font:14px system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh}header,footer,.toolbar{display:flex;gap:10px;align-items:center;padding:12px;background:#202429;border-bottom:1px solid var(--border);flex-wrap:wrap}header h1{font-size:19px;margin:0 auto 0 0;letter-spacing:.05em}header h1 span{color:var(--green)}button,input,select{font:inherit;background:#2b3035;color:inherit;border:1px solid #484e55;border-radius:5px;padding:8px}button{cursor:pointer}button:hover{border-color:var(--green)}button.active,button.primary{background:#17543a;border-color:var(--green);color:#e4ffed}button:disabled{opacity:.4;cursor:default}main{display:grid;grid-template-columns:225px minmax(0,1fr) 272px;min-height:0;flex:1;gap:8px;padding:8px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:12px;overflow:auto}.panel h2{font-size:14px;margin:0 0 12px;border-bottom:1px solid var(--border);padding-bottom:10px}.panel section+section{margin-top:18px}label{display:block;margin:9px 0;color:var(--muted)}input[type=number]{width:100%;min-width:0}input[type=range]{width:100%;accent-color:var(--green)}.row{display:flex;gap:6px;align-items:center}.row>*{min-width:0;flex:1}.stack{display:grid;gap:7px}.template{text-align:left;padding:11px}.template small{display:block;color:var(--muted);margin-top:4px}#materials button{display:flex;gap:9px;align-items:center;text-align:left;word-break:break-word;padding:8px}.swatch{width:25px;height:25px;flex-shrink:0;border:1px solid #ffffff26;border-radius:3px}#search{width:100%;margin-bottom:8px}.center{min-width:0;min-height:0;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:7px;overflow:hidden}.toolbar{padding:9px}.viewport{flex:1;min-height:0;position:relative;background:#191d21}canvas{display:block;width:100%;height:100%;touch-action:none}.hint{position:absolute;left:12px;top:10px;pointer-events:none;color:#c2cbd2;font-size:12px;max-width:92%}.note{color:var(--muted);line-height:1.5;font-size:12px}#checks{line-height:1.65;overflow-wrap:anywhere}#status{margin-right:auto;overflow-wrap:anywhere}footer{border-top:1px solid var(--border);border-bottom:0;font-size:12px}#error{color:#ffbd91}.hidden{display:none}@media(max-width:950px){body{height:auto;min-height:100dvh}main{grid-template-columns:180px minmax(0,1fr)}.right{grid-column:1/-1}.viewport{min-height:470px}}@media(max-width:600px){main{display:flex;flex-direction:column}.viewport{min-height:420px}.panel{max-height:none}#materials{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body>
<header><h1><span>◆</span> STRUCTURE STUDIO <small>V0.3</small></h1><button id="undo">撤销 Ctrl+Z</button><button id="redo">重做 Ctrl+Y</button><button id="import">导入 JSON</button><button id="json">导出 JSON</button><button id="nbt" class="primary">导出 NBT</button><input id="file" class="hidden" type="file" accept=".json,application/json"></header>
<main><aside class="panel"><section><h2>建筑模板</h2><div id="templates" class="stack"><button class="template" data-preset="house">房屋<small>13 × 7 × 11</small></button><button class="template" data-preset="tower">塔楼<small>11 × 15 × 11</small></button><button class="template active" data-preset="factory">机械工厂<small>27 × 8 × 17</small></button><button class="template" data-preset="dungeon">地牢迷宫<small>31 × 7 × 25 · 8 个房间</small></button><button id="blank">空白建筑</button></div></section><section><h2>方块材料库</h2><input id="search" placeholder="搜索方块"><div id="materials" class="stack"></div><label for="material">自定义方块 ID</label><input id="material" value="minecraft:stone_bricks" style="width:100%"><div class="note">仅校验 ID 格式；实际注册表由 Minecraft 验证。</div></section></aside>
<section class="center"><div class="toolbar"><button data-mode="place" class="active">放置 B</button><button data-mode="erase">擦除 E</button><button data-mode="preserve">保留 P</button><button id="rotateLeft">↶ 旋转</button><button id="rotateRight">↷ 旋转</button><button id="all">完整预览</button></div><div class="viewport"><canvas id="view" aria-label="等轴测建筑编辑视图"></canvas><div id="hint" class="hint">点击当前层网格编辑 · Shift 点击选择坐标 · 空气会清除原方块</div></div></section>
<aside class="panel right"><section><h2>建筑属性</h2><label>尺寸（X / Y / Z）</label><div class="row"><input id="width" type="number" min="1" max="48" aria-label="宽"><input id="height" type="number" min="1" max="48" aria-label="高"><input id="depth" type="number" min="1" max="48" aria-label="深"></div><label for="seed">随机种子</label><div class="row"><input id="seed" type="number" min="0" max="4294967295" value="42"><button id="generate">重新生成</button></div><p class="note">重新生成会重置当前编辑及历史；尺寸仅在生成时生效。</p></section>
<section id="dungeonOptions" hidden><h2>地牢生成参数</h2>
<label for="dungeonStyle">主题风格</label><select id="dungeonStyle" style="width:100%"><option value="stone">古堡石砖</option><option value="crypt">深板岩墓穴</option><option value="bunker">工业地堡</option></select>
<label for="dungeonRooms">房间数量（4–16）</label><input id="dungeonRooms" type="number" min="4" max="16" value="8">
<label for="hiddenRooms">隐藏房间（0–2）</label><input id="hiddenRooms" type="number" min="0" max="2" value="1">
<label for="corridorWidth">普通走廊宽度</label><select id="corridorWidth" style="width:100%"><option value="1">1 格 · 紧凑</option><option value="2" selected>2 格 · 标准</option><option value="3">3 格 · 宽阔</option></select>
<label for="loopChance">额外环路概率 <strong id="loopChanceLabel">0.18</strong></label><input id="loopChance" type="range" min="0" max="0.6" step="0.02" value="0.18">
<p class="note">隐藏房仍通过窄通道连接；概率控制额外连接，不代表关卡难度。</p></section>
<section><h2>选中坐标</h2><div class="row"><input id="x" type="number" min="0" aria-label="X"><input id="z" type="number" min="0" aria-label="Z"></div><label for="layer">活动 Y 层 <strong id="layerLabel"></strong></label><input id="layer" type="range" min="0" max="7" value="3"><button id="apply" style="width:100%">在坐标应用工具</button><p id="selected" class="note"></p></section>
<section><h2>结构检查</h2><div id="checks"></div><p class="note">通行性仅为地面层静态近似，不代表游戏内碰撞或寻路。</p><div id="error" role="alert"></div></section></aside></main>
<footer><span id="status" role="status">准备就绪</span><span id="counts"></span><span>Java 26.2 · NBT</span></footer>
<script type="module" src="./editor-ui.mjs"></script></body></html>
